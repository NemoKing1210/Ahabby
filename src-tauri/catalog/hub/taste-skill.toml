# `taste-skill` — art direction for the frontend, distilled from a study of curated sites, so an
# agent designs a page instead of shipping the look every model produces by default.
#
# SOURCE: https://github.com/Leonxlnx/taste-skill (checked 2026-10-14) — `skills/<name>/SKILL.md`;
#   the repository declares the MIT license. Three entries are earlier versions of the flagship
#   `design-taste-frontend` skill, kept for projects that depend on their exact behaviour.
id = "taste-skill"
name = "Taste Skill"
kind = "githubSkills"
repository = "Leonxlnx/taste-skill"
path = "skills"
provides = ["skill"]
vendor = "Leonxlnx"
homepage = "https://github.com/Leonxlnx/taste-skill"
license = "MIT"
description = """Design taste for coding agents: art direction, layout variance and motion rules for
websites, image-direction skills that produce the design references before the code, brand kits,
minimalist and industrial interface styles, and a redesign skill that audits what is already there
and lifts it to the quality of a good agency's work."""

tags = ["design", "frontend"]

