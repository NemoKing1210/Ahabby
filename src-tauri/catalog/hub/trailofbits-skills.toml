# Trail of Bits security skills — static analysis, differential review, and audit workflows.
#
# SOURCE: https://github.com/trailofbits/skills (checked 2026-10-09) —
#   `plugins/<plugin>/skills/<skill>/SKILL.md`; the repository declares CC-BY-SA-4.0.
id = "trailofbits-skills"
name = "Trail of Bits Skills"
kind = "githubSkills"
repository = "trailofbits/skills"
provides = ["skill"]
vendor = "Trail of Bits"
homepage = "https://github.com/trailofbits/skills"
docs = "https://trailofbits-skills.mintlify.app/quickstart"
license = "CC-BY-SA-4.0"
description = """Security research and audit skills from Trail of Bits: Semgrep and CodeQL,
differential review, variant analysis, supply-chain risk, and language-specific review plugins."""

