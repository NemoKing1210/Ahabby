# Addy Osmani's production-grade engineering skills — the method an agent is meant to follow from a
# written spec to a launch.
#
# SOURCE: https://github.com/addyosmani/agent-skills (checked 2026-10-14) — 25
#   `skills/<name>/SKILL.md` directories; the repository declares the MIT license. It also carries
#   `agents/`, `commands/` and `hooks/` for other harnesses, which `path` leaves out of the Hub.
id = "addyosmani-skills"
name = "Addy Osmani's Skills"
kind = "githubSkills"
repository = "addyosmani/agent-skills"
path = "skills"
provides = ["skill"]
vendor = "Addy Osmani"
homepage = "https://github.com/addyosmani/agent-skills"
license = "MIT"
description = """A full engineering method for coding agents: spec-, constraint- and source-driven
development, planning and task breakdown, incremental implementation, test-driven work, review and
simplification, debugging and error recovery, security hardening, observability, performance,
documentation, and the launch that follows."""

# The whole collection is one working method, so that much is declared for every entry; the rules
# below add the subject each skill is about. The prefixes are the repository's own directories.
tags = ["development", "workflow"]

