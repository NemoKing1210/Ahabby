# Marketing skills for coding agents — the marketing toolkit of a small company, one skill per job.
#
# SOURCE: https://github.com/coreyhaines31/marketingskills (checked 2026-10-14) — 50
#   `skills/<name>/SKILL.md` directories; the repository declares the MIT license.
id = "marketing-skills"
name = "Marketing Skills"
kind = "githubSkills"
repository = "coreyhaines31/marketingskills"
path = "skills"
provides = ["skill"]
vendor = "Corey Haines"
homepage = "https://github.com/coreyhaines31/marketingskills"
license = "MIT"
description = """Marketing work an agent can actually do: conversion optimisation and landing pages,
copywriting and copy editing, SEO and programmatic SEO, paid ads and ad creative, email and cold
outreach, pricing, onboarding, analytics and attribution, launches and events — and the growth loops
that tie them together."""

# What each skill is *for*, so the Hub can be browsed and filtered by subject instead of by
# directory layout. The prefixes are the repository's own directories (see `catalog/HUB.md`).
tags = ["marketing"]

