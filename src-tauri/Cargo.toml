[package]
name = "ahabby"
version = "0.24.0"
description = "Ahabby — a control panel for the AI coding agents installed on your machine"
authors = ["Ahabby contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.82"
default-run = "ahabby"

[lib]
name = "ahabby_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
# The native folder picker of the Projects screen. Only the Rust side uses it (no JS package,
# no webview capability): the dialog is opened by `commands::projects::pick_project_folder` and
# the frontend receives a path, exactly like every other value it renders.
tauri-plugin-dialog = "2.7.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
toml_edit = { version = "0.25", features = ["serde"] }
serde_yaml = "0.9"
tokio = { version = "1.53", features = [
  "rt-multi-thread",
  "macros",
  "process",
  "sync",
  "time",
  "fs",
  "io-util",
] }
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "7.0"
which = "8.0"
walkdir = "2.5"
semver = "1.0"
# Already in the tree through reqwest; used to validate manual proxy URLs in Settings.
url = "2.5"
similar = "3.2"
trash = "5.2"
sha2 = "0.11"
hex = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
globset = "0.4"
futures = "0.3"
async-trait = "0.1"
reqwest = { version = "0.13", default-features = false, features = [
  "default-tls",
  "json",
] }
ts-rs = { version = "12.0", features = ["no-serde-warnings"] }
# The built-in terminal needs a real PTY (ConPTY on Windows, `openpty` elsewhere) so that
# full-screen agents like Claude Code see a console; portable-pty is the cross-platform
# implementation, used through `services::terminal`.
portable-pty = "0.9.0"
# PTY output is arbitrary bytes and may split a UTF-8 sequence across reads, so it crosses
# the IPC boundary base64-encoded and is decoded in the frontend. Already in the tree
# through reqwest (0.22), so the version is pinned to share it.
base64 = "0.22"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3.27"

[features]
# Used by `tauri build` so the frontend assets are served from the binary.
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
