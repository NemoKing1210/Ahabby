<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Ahabby</title>
    <!--
      Boot splash — the first thing the webview paints, before the bundle and the stylesheet.
      `#root` stays empty until React mounts and the first scan lands, so without this the
      window opens blank. `src/app/splash.ts` fades it out once the app has painted.

      It is inline because a splash cannot wait for its own stylesheet. The palette mirrors
      `globals.css`: colours come from the real tokens with the light values as `var()`
      fallbacks, so the fallbacks only cover the instant before the stylesheet lands — after
      that the tokens win and the splash follows the pinned theme. The mark is the exception:
      it keeps the app mark's own palette whatever accent the user picked.
    -->
    <style>
      html {
        /* The canvas behind the splash, so the window is never white on a dark theme. */
        background-color: var(--ah-background, #faf9f5);
      }

      @media (prefers-color-scheme: dark) {
        html {
          background-color: var(--ah-background, #1f1e1d);
        }
      }

      #ah-splash {
        --s-bg: var(--ah-background, #faf9f5);
        --s-fg: var(--ah-foreground, #141413);
        --s-tile: #151619;
        --s-ring: rgb(20 20 19 / 0);
        --s-elevation: 0 18px 44px -20px rgb(20 20 19 / 0.45);
        --s-halo: rgb(255 132 102 / 0.15);
        --s-filter: none;

        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        overflow: hidden;
        background-color: var(--s-bg);
        color: var(--s-fg);
        font-family:
          'Inter',
          ui-sans-serif,
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
        font-size: 14px;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
        cursor: default;
        user-select: none;
        -webkit-user-select: none;
        transition: opacity 240ms cubic-bezier(0.2, 0.8, 0.2, 1);
      }

      @media (prefers-color-scheme: dark) {
        #ah-splash {
          --s-bg: var(--ah-background, #1f1e1d);
          --s-fg: var(--ah-foreground, #faf9f5);
          --s-tile: #151619;
          --s-ring: rgb(250 249 245 / 0.08);
          --s-elevation: 0 18px 44px -20px rgb(0 0 0 / 0.6);
          --s-halo: rgb(255 132 102 / 0.22);
          --s-filter: drop-shadow(0 0 7px rgb(167 139 250 / 0.42));
        }
      }

      /* Once `themeApplier` has run, the resolved theme — not the OS — decides. */
      html.dark #ah-splash {
        --s-tile: #151619;
        --s-ring: rgb(250 249 245 / 0.08);
        --s-elevation: 0 18px 44px -20px rgb(0 0 0 / 0.6);
        --s-halo: rgb(255 132 102 / 0.22);
        --s-filter: drop-shadow(0 0 7px rgb(167 139 250 / 0.42));
      }

      #ah-splash .ah-splash__halo {
        position: absolute;
        left: 50%;
        top: 50%;
        translate: -50% -50%;
        width: 460px;
        height: 460px;
        border-radius: 50%;
        background: radial-gradient(circle, var(--s-halo), transparent 68%);
        pointer-events: none;
        animation: ah-splash-breathe 4.4s cubic-bezier(0.37, 0, 0.63, 1) infinite;
      }

      #ah-splash .ah-splash__stack {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        transition:
          translate 240ms cubic-bezier(0.2, 0.8, 0.2, 1),
          scale 240ms cubic-bezier(0.2, 0.8, 0.2, 1);
      }

      #ah-splash .ah-splash__mark {
        position: relative;
        width: 76px;
        height: 76px;
        border-radius: 18px;
        background-color: var(--s-tile);
        box-shadow:
          var(--s-elevation),
          inset 0 0 0 1px var(--s-ring);
        overflow: hidden;
        animation: ah-splash-pop 520ms cubic-bezier(0.2, 0.8, 0.2, 1) both;
      }

      #ah-splash .ah-splash__mark svg {
        display: block;
        width: 100%;
        height: 100%;
        filter: var(--s-filter);
      }

      #ah-splash .ah-splash__sheen {
        position: absolute;
        top: -25%;
        bottom: -25%;
        left: 0;
        width: 22px;
        background: linear-gradient(90deg, transparent, rgb(255 255 255 / 0.18), transparent);
        transform: translateX(-40px) skewX(-18deg);
        animation: ah-splash-sheen 2.8s cubic-bezier(0.4, 0, 0.2, 1) 600ms infinite;
      }

      #ah-splash[data-state='leaving'] {
        opacity: 0;
      }

      #ah-splash[data-state='leaving'] .ah-splash__stack {
        translate: 0 -10px;
        scale: 0.98;
      }

      @keyframes ah-splash-pop {
        from {
          opacity: 0;
          transform: scale(0.88);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }

      @keyframes ah-splash-breathe {
        0%,
        100% {
          opacity: 0.5;
          scale: 0.92;
        }
        50% {
          opacity: 1;
          scale: 1.05;
        }
      }

      @keyframes ah-splash-sheen {
        0% {
          opacity: 0;
          transform: translateX(-40px) skewX(-18deg);
        }
        10%,
        45% {
          opacity: 1;
        }
        60%,
        100% {
          opacity: 0;
          transform: translateX(96px) skewX(-18deg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #ah-splash,
        #ah-splash * {
          animation: none !important;
          transition: none !important;
        }
      }
    </style>
  </head>
  <body class="h-full">
    <div id="root" class="h-full"></div>
    <div id="ah-splash" role="status" aria-busy="true">
      <div class="ah-splash__halo" aria-hidden="true"></div>
      <div class="ah-splash__stack">
        <div class="ah-splash__mark" aria-hidden="true">
          <svg viewBox="0 0 100 100">
            <defs>
              <linearGradient
                id="ah-splash-mark"
                x1="24"
                y1="76"
                x2="77"
                y2="22"
                gradientUnits="userSpaceOnUse"
              >
                <stop offset="0" stop-color="#ff8466" />
                <stop offset="0.48" stop-color="#ffb36b" />
                <stop offset="1" stop-color="#a78bfa" />
              </linearGradient>
            </defs>
            <path
              d="M27 72 L43 31 Q50 13 57 31 L73 72"
              fill="none"
              stroke="url(#ah-splash-mark)"
              stroke-width="14"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <path
              d="M37 56 C44 53 56 53 63 56"
              fill="none"
              stroke="url(#ah-splash-mark)"
              stroke-width="12"
              stroke-linecap="round"
            />
            <circle cx="50" cy="28" r="3.6" fill="#fff8ef" />
          </svg>
          <span class="ah-splash__sheen"></span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
